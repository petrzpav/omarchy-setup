onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
# VS Code: ctrl+shift+; = new terminal
new_tab = ["prefix+c", "ctrl+shift+;", "ctrl+t"]
rename_tab = "prefix+r"
close_tab = ["prefix+k", "ctrl+w"]
switch_tab = ["prefix+1..9", "alt+1..9", "ctrl+1..9"]
# VS Code: ctrl+tab / ctrl+shift+tab = next/previous editor tab
# (herdr 0.8.2 cannot bind PageUp/PageDown)
previous_tab = ["prefix+p", "alt+left", "ctrl+shift+tab"]
next_tab = ["prefix+n", "alt+right", "ctrl+tab"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
# Spaces are permanent (petrzpav.persistent-spaces plugin): closing the last
# tab or pane recreates the space; prefix+shift+k below deletes it for good
close_workspace = ""
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Pickers: search/jump to any workspace or agent (like VS Code ctrl+p)
workspace_picker = ["prefix+w", "ctrl+alt+w"]
goto = "prefix+g"

# Sidebar
toggle_sidebar = "ctrl+b"

# Agents: cycle through the agent panel; ctrl+alt+i was the Claude toggle in VS Code
previous_agent = "alt+shift+up"
next_agent = ["alt+shift+down", "ctrl+alt+i"]

# Cycle through built-in themes (script edits [theme] name and reloads)
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/.local/bin/herdr-theme-cycle next"

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "~/.local/bin/herdr-theme-cycle prev"

# Delete the current space for good; any other way it closes, it comes back
[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "petrzpav.persistent-spaces.delete"
description = "delete space"

# Re-sort spaces alphabetically (herdr has no sort option; new spaces go to the end)
[[keys.command]]
key = "prefix+s"
type = "shell"
command = "~/.local/bin/herdr-sort-spaces"

# ctrl+p: search-first space switcher (fzf popup); built-in goto stays on prefix+g
[[keys.command]]
key = "ctrl+p"
type = "popup"
command = "~/.local/bin/herdr-goto"
width = "50%"
height = "50%"

[ui]
accent = "blue"

# ctrl+b hides the sidebar completely instead of leaving the narrow status rail
sidebar_collapsed_mode = "hidden"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[ui.sidebar.spaces]
# No blank rows between space entries
row_gap = 0
# One line per space: just the name, no branch or git status. The $dev_* tokens
# are the localhost Laravel status reported by herdr-laravel-run.
rows = [[
  "state_icon",
  "workspace",
  { token = "$dev_busy", fg = "#e0af68" },
  { token = "$dev_ok", fg = "#9ece6a" },
  { token = "$dev_err", fg = "#f7768e" },
]]

[ui.toast]
delivery = "off"

[ui.sound]
# No chime when an agent finishes or needs input
enabled = false
